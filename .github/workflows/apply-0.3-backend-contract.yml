name: Apply Runtime 0.3 backend contract foundation

on:
  push:
    branches:
      - feat/0.3-backend-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply 0.3 foundation
        run: |
          python3 .github/apply_03_backend_contract.py
          python3 .github/fix_03_registry_tests.py

      - name: Format and verify
        run: |
          gofmt -w internal/backendcontract internal/backendrouter internal/modelmanifest internal/modelpolicy internal/ollama internal/upstreamledger internal/httpapi
          ./scripts/verify.sh
          git diff --check

      - name: Commit patch and remove temporary builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-0.3-backend-contract.yml .github/apply_03_backend_contract.py .github/fix_03_registry_tests.py
          git add -A
          git commit -m "feat: add Runtime 0.3 backend capability foundation"
          git push origin HEAD:feat/0.3-backend-contract
