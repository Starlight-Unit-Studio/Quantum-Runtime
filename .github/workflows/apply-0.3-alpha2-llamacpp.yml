name: Apply Runtime 0.3 alpha.2 llama.cpp direct adapter

on:
  push:
    branches:
      - feat/0.3.0-alpha.2-llamacpp-native

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply llama.cpp direct adapter patch
        run: python3 .github/apply_03_alpha2_llamacpp.py

      - name: Format and verify
        run: |
          gofmt -w internal/llamacpp internal/config cmd/quantum-runtime
          ./scripts/verify.sh
          git diff --check

      - name: Commit patch and remove temporary builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-0.3-alpha2-llamacpp.yml .github/apply_03_alpha2_llamacpp.py
          git add -A
          git commit -m "feat: add direct llama.cpp backend path"
          git push origin HEAD:feat/0.3.0-alpha.2-llamacpp-native
