name: Tighten Runtime 0.3 alpha.2 llama.cpp fail-closed semantics

on:
  push:
    branches:
      - feat/0.3.0-alpha.2-llamacpp-native

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Patch explicit reasoning-control handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/llamacpp/client.go')
          s = p.read_text()
          old = 'if rawPresent(input.Think) {\n\t\treturn unsupported("reasoning.control is not yet normalized by the llama.cpp direct adapter"), nil\n\t}'
          new = 'if rawProvided(input.Think) {\n\t\treturn unsupported("reasoning.control is not yet normalized by the llama.cpp direct adapter"), nil\n\t}'
          if s.count(old) != 1:
              raise SystemExit('reasoning-control marker mismatch')
          s = s.replace(old, new, 1)
          old = '"capabilities": []string{"completion", "embedding"},'
          new = '"capabilities": []string{"completion"},'
          if s.count(old) != 1:
              raise SystemExit('capabilities marker mismatch')
          s = s.replace(old, new, 1)
          marker = 'func rawPresent(raw json.RawMessage) bool {'
          helper = '''func rawProvided(raw json.RawMessage) bool {\n\ttrimmed := bytes.TrimSpace(raw)\n\treturn len(trimmed) > 0 && !bytes.Equal(trimmed, []byte("null"))\n}\n\n'''
          if s.count(marker) != 1:
              raise SystemExit('rawPresent marker mismatch')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)

          t = Path('internal/llamacpp/client_test.go')
          s = t.read_text()
          old = '`{"model":"ember-coreui:latest","messages":[{"role":"user","content":"hi"}],"think":true}`,'
          new = old + '\n\t\t`{"model":"ember-coreui:latest","messages":[{"role":"user","content":"hi"}],"think":false}`,'
          if s.count(old) != 1:
              raise SystemExit('test marker mismatch')
          s = s.replace(old, new, 1)
          t.write_text(s)
          PY
          gofmt -w internal/llamacpp
          ./scripts/verify.sh
          git diff --check
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-0.3-alpha2-llamacpp.yml
          git add -A
          git commit -m "fix: fail closed on explicit llama.cpp reasoning control"
          git push origin HEAD:feat/0.3.0-alpha.2-llamacpp-native
